<!--
  ============================================================
  RASPBERRY PI KIOSK AUTOSTART SETUP
  ============================================================

  1. Edit the LXDE autostart file:
     sudo nano /etc/xdg/lxsession/LXDE-pi/autostart

  2. Add these lines (adjust path if needed):
     @xset s off
     @xset -dpms
     @xset s noblank
     @unclutter -idle 0.5 -root &
     @chromium-browser --kiosk --noerrdialogs --disable-infobars --no-first-run --disable-session-crashed-bubble --disable-restore-session-state http://localhost:5000

  3. To start the server on boot, add to /etc/rc.local or create a systemd service:
     cd /home/pi/fablab-kanban && python3 -m http.server 5000 &

  4. Reboot: sudo reboot

  The app will auto-fullscreen on load via the Fullscreen API.
  The screensaver activates after 3 minutes of idle.
  ============================================================
-->
